name: Build CorixOS ISO
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install deps
        run: sudo apt update && sudo apt install -y live-build debootstrap squashfs-tools xorriso isolinux grub-pc-bin grub-efi-amd64-bin ovmf python3-pyqt5 flatpak plasma-discover-flatpak-backend imagemagick
      - name: build
        run: |
          chmod +x build.sh
          cd live
          sudo ../build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: CorixOS-amd64
          path: live/CorixOS.iso
          retention-days: 30
      - name: release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: live/CorixOS.iso
          generate_release_notes: true
